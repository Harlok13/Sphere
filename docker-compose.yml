version: "3.9"

services:
  sph.api-gateway:
    container_name: sph.api-gateway
    build:
      context: .
      dockerfile: src/Services/ApiGateway/Harlok.Sphere.ApiGateway.API/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - sph.keycloak
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__AuthServerUrl=http://sph.keycloak:8000
      - JwtTokenValidation__ValidIssuer=http://localhost:8000/realms/auth-service
        
  sph.keycloak:
    container_name: sph.keycloak
    hostname: sph.keycloak
    image: quay.io/keycloak/keycloak:23.0.4
    ports:
      - "8000:8080"
    environment:
      - KEYCLOAK_ADMIN=Admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./volumes/keycloak/import:/opt/jboss/keycloak/data/import
    command: ["start-dev", "--import-realm"]



