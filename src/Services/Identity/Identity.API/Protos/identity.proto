//    int32 has21 = 14;
//}

message GrpcAuthenticateResponse {
    string player_id = 1;
    string player_name = 2;
    string email = 3;
    string token = 4;
    string refresh_token = 5;
//    PlayerInfoResponse player_info = 6;
}

message GrpcRegisterRequest {
    string email = 1;
    string user_name = 2;
    string password = 3;
    string password_confirm = 4;
}

message GrpcRegisterResponse {
    string email = 1;
    string password = 2;
    string user_id = 3;
}

message GrpcRefreshTokenRequest {
    string access_token = 1;
    string refresh_token = 2;
}

message GrpcRefreshTokenResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message GrpcRevokeRequest {
    string user_name = 1;
}

message GrpcRevokeResponse {
    bool success = 1;
}

message GrpcRevokeAllRequest {

}

message GrpcRevokeAllResponse {
    bool success = 1;
}