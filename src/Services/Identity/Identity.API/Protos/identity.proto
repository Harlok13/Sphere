syntax = "proto3";

option csharp_namespace = "GrpcIdentityService";

package identity;

service Identity {
    rpc Authenticate (GrpcAuthenticateRequest) returns (GrpcAuthenticateResponse);

    rpc Register (GrpcRegisterRequest) returns (GrpcRegisterResponse);

    rpc RefreshToken (GrpcRefreshTokenRequest) returns (GrpcRefreshTokenResponse);

    rpc Revoke (GrpcRevokeRequest) returns (GrpcRevokeResponse);

    rpc RevokeAll(GrpcRevokeAllRequest) returns (GrpcRevokeAllResponse);
}

message GrpcAuthenticateRequest {
    string email = 1;
    string password = 2;
}

