syntax = "proto3";

option csharp_namespace = "GrpcUserInteractionClient";

package user_interaction;

service UserInteraction {
    rpc AddToFriends(GrpcAddToFriendsRequest) returns (GrpcAddToFriendsResponse);

    rpc CreatePlayerInfo(GrpcCreatePlayerInfoRequest) returns (GrpcCreatePlayerInfoResponse);
    
    rpc GetPlayerInfo(GrpcGetPlayerInfoRequest) returns (GrpcGetPlayerInfoResponse);
}

message GrpcAddToFriendsRequest {
    string name = 1;
}

message GrpcAddToFriendsResponse {
    string name = 1;
}

message GrpcCreatePlayerInfoRequest {
    string user_id = 1;
    string player_name = 2;
}

message GrpcCreatePlayerInfoResponse {

}

message GrpcGetPlayerInfoRequest {
    string player_id = 1;
}

