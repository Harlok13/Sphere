message GrpcGetPlayerInfoResponse {
    string id = 1;
    string avatar_url = 2;
    string player_name = 3;
    int32 matches = 4;
    int32 loses = 5;
    int32 wins = 6;
    int32 draws = 7;
    int32 all_exp = 8;
    int32 current_exp = 9;
    int32 target_exp = 10;
    int32 money = 11;
    int32 likes = 12;
    int32 level = 13;
    int32 has21 = 14;
}