<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *,
        *:before,
        *:after {
            padding: 0;
            margin: 0;
            border: 0;
            box-sizing: border-box;
        }
        html{
            height: 100%;
            background-color: #333;
            color: #fff;
            font-size: 20px;
        }
        .wrapper{
            min-height: 100%;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .timer{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .timer:before{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            z-index: 3;
            background-color: #fff;
            animation: mask_left 10s steps(1, end) forwards;
        }
        .timer:after{
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 3;
            background-color: #7a956b;
            animation: mask_right 10s steps(1, end) forwards;
        }
        .timer__line{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /*background-color: #666;*/
            z-index: 2;
            animation: line 10s linear forwards;
        }
        .timer__line:after{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #7a956b;
        }
        .timer__body{
            width: 100px;
            height: 100px;
            background-color: #333;
            border-radius: 50%;
            text-align: center;
            overflow: hidden;
            z-index: 4;
        }
        .timer__counter{
            animation: counter 10s steps(9, end) forwards;
        }
        .timer__counter span {
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        @keyframes counter {
            0%{

            }
            100%{
                transform: translate(0px, -900px);
            }
        }
        @keyframes line{
            0%{
            }
            100%{
                transform: rotate(360deg);
            }
        }
        @keyframes mask_left {
            0%{
                visibility: visible;
                /*background-color: #7a956b;*/
            }
            50%,
            100%{
                visibility: hidden;
                /*background-color: #1b6ec2;*/
            }
        }
        @keyframes mask_right {
            0%{
                visibility: hidden;
            }
            50%,
            100%{
                visibility: visible;
            }
        }

        body {
            height: 100%;
            width: 100%;
            background-color: #333;
        }

        #countdown {
            position: relative;
            margin: auto;
            margin-top: 100px;
            height: 40px;
            width: 40px;
            text-align: center;
        }

        #countdown-number {
            color: white;
            display: inline-block;
            line-height: 40px;
        }

        svg {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 40px;
            transform: rotateY(-180deg) rotateZ(-90deg);
        }

        svg circle {
            stroke-dasharray: 113px;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            stroke-width: 2px;
            stroke: white;
            fill: none;
            animation: countdown 10s linear infinite forwards;
        }

        @keyframes countdown {
            from {
                stroke-dashoffset: 0;
            }
            to {
                stroke-dashoffset: 113px;
            }
        }
        img{
            position: absolute;
            width: 32px;
            height: 32px;
            top: 4px;
            left: 4px;
        }

    </style>
</head>
<body>
<div class="wrapper">
    <div id="countdown">
<!--        <div id="countdown-number"></div>-->
        <svg>
            <circle r="18" cx="20" cy="20"></circle>
            <img src="img/avatars/default_avatar.png" alt="">
        </svg>
    </div>
    <svg width="270" height="270">
        <g class="g-circles" fill="none"
           stroke-width="15"
           stroke-dasharray="25% 110%"
           transform="rotate(72 135 135)">
            <circle r="115" cx="135" cy="135"
                    stroke="crimson"/> <!-- Красная обводка без смещения -->
            <circle r="115" cx="135" cy="135"
                    stroke="orangered"
                    stroke-dashoffset="25%"/> <!-- Оранжевая обводка смещена на 25% -->
            <circle r="115" cx="135" cy="135"
                    stroke="gold"
                    stroke-dashoffset="50%"/> <!-- Желтая обводка смещена на 50% -->
        </g>
    </svg>
    <div class="timer">
        <div class="timer__line"></div>
        <div class="timer__body">
            <div class="timer__counter">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
                <span>7</span>
                <span>8</span>
                <span>9</span>
                <span>10</span>
            </div>
        </div>
    </div>
</div>

<script>
    var countdownNumberEl = document.getElementById('countdown-number');
    var countdown = 10;

    countdownNumberEl.textContent = countdown;

    setInterval(function() {
        countdown = --countdown <= 0 ? 10 : countdown;

        countdownNumberEl.textContent = countdown;
    }, 1000);
</script>
</body>
</html>
